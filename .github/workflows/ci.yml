name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:  # a new push to the same PR/branch cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ISO21423_REF: main

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [jazzy, humble]
    steps:
      - uses: actions/checkout@v4
        with:
          path: iso21423_ros
      - uses: actions/checkout@v4
        with:
          repository: OpenRobOps/iso21423
          ref: ${{ env.ISO21423_REF }}
          path: iso21423
      - run: iso21423_ros/scripts/test.sh
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}

  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk space  # the flatland image is ~6 GB
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          path: iso21423_ros
      - uses: actions/checkout@v4
        with:
          repository: OpenRobOps/iso21423
          ref: ${{ env.ISO21423_REF }}
          path: iso21423
      - run: iso21423_ros/scripts/sim_test.sh
